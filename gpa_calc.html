<!DOCTYPE html>
<!-- This code was provided as starter code by my teacher. -->
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>GPA Calculator</title>
	<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
	<style>
		header {
			background-color: rgb(0, 26, 255);
			padding: 20px;
			text-align: center;
			font-size: 35px;
			color: gold;
		}
		.app {
			background-color: gold;
			padding: 30px;
			color: blue;
		}
		#error {
			color: red;
			font-weight: bold;
		}
	</style>
</head>

<body>
	<header>
		<h2>GPA Calculator</h2>
	</header>
	<div class="app" x-data="gpaCalculator">
		<label>Enter your current GPA (unweighted):</label>
		<!--number-only input box-->
		<input type="number" x-model.number="currentGPA" @input="validateGPA(); checkForCurrentGPAandGrade(); calculate()"> 
		<label id="error" x-show="hasGPAError">
			<br>Please enter a valid GPA between 0.00 and 4.00.
		</label>
		<br>
		<label>What is your current grade?</label>
		<!--radio buttons for 10th-12th-->
		<input type="radio" name="gradeLevelRadio" value="10" x-model="currentGradeLevel" @change="calculate(); checkForCurrentGPAandGrade()">
		<span>10th</span>
		<input type="radio" name="gradeLevelRadio" value="11" x-model="currentGradeLevel" @change="calculate(); checkForCurrentGPAandGrade()">
		<span>11th</span>
		<input type="radio" name="gradeLevelRadio" value="12" x-model="currentGradeLevel" @change="calculate(); checkForCurrentGPAandGrade()">
		<span>12th</span>
		<br><br>
		<div x-show="displayAdd">
			<label>Fill in this year's courses</label>
			<!--for periods 1-4 for A-day and again for B-day
			input box to place course name (have something for if no course)
			dropdown selection for numeric grade goal-->
			<br>
			<label x-text="blockDay + '-Day, Period ' + periodNumber + ':  '"></label>
			<input type="text"  placeholder="Course name..." x-model="courseTitle" :disabled="disableCourseInput">
			<label> Final Grade Goal:</label>
			<select name="courseGradeDropdown" x-model="courseGrade" :disabled="disableCourseInput">
				<!--This dropdown template was generated by Gemini AI-->
				<template x-for="num in gradeChoices">
							<option :value="num" x-text="num"></option>
				</template>
			</select>
			<br>
			<input type="checkbox" x-model="noCourse" @change="toggleInputs()" :disabled="disableCourseFields">
			<span>Check box if no course this period.</span>
			<button x-text="addCourseButtonText" @click="addCourse()" :disabled="disableCourseFields"></button>
		</div>
		<div x-show="displayEdit">
			<br>
			<span>Course List</span>
			<pre x-text="courseListDisplay"></pre>
			<br><br>
			<label>Edit Courses</label>
			<br>
			<select name="courseListDropdown" x-model="courseToEdit" :disabled="disableEditFields" @change="updateEditFields()">
				<option value="" disabled selected>-- Select a course to edit --</option>
				<template x-for="[course, grade] of Object.entries(courseList)">
					<option :value="course" x-text="course"></option>
				</template>
			</select>
			<label x-text="blockEdit + ':  '"></label>
			<input type="text"  placeholder="New course name..." x-model="courseTitleEdit" :disabled="disableEditFields">
			<label> Final Grade Goal:</label>
			<select name="courseGradeDropdownEdit" x-model="courseGradeEdit" :disabled="disableEditFields">
				<!--This dropdown template was generated by Gemini AI-->
				<template x-for="num in gradeChoices">
							<option :value="num" x-text="num"></option>
				</template>				
			</select>
			<button @click="editCourse()" :disabled="disableEditFields">CONFIRM</button>
			<br><br>
			<button @click="resetCourses()" :disabled="disableEditFields">RESET ALL</button>
		</div>
		<div x-show="displayProjectedGPA">
			<br>
			<label>Projected GPA: </label>
			<!--Displays gpa each time a course is grade goal is updated-->
			<label x-text="projectedGPA.toFixed(2)"></label>
		</div>
		<div x-show="displayClear">
			<!--clears the courses, current gpa, and selected grade-->
			<button @click="reset()">CLEAR ALL</button>
		</div>
	</div>
	<script>
		document.addEventListener('alpine:init', () => {
			Alpine.data('gpaCalculator', () => ({
				gradeChoices: Array.from({length: 51}, (_, i) => 100 - i),
				disableCourseInput: false,
				disableCourseFields: false,
				disableEditFields: false,
				courseList: {},
        currentGPA: 0.00,
        hasGPAError: false,
        currentGradeLevel: 10,
        currentGradeLevel: 11,
        currentGradeLevel: 12,
        displayAdd: false,
        courseTitle: 0,
        blockDay : "A",
        courseGrade: 100,
        num: 0,
        noCourse: 0,
        addCourseButtonText: "Add Course",
        displayEdit: false,
        courseListDisplay: 0,
        courseToEdit: 0,
        course: 0,
        blockEdit: "Course Name",
        courseTitleEdit: "...",
        courseGradeEdit: 0,
        num: 0,
        displayProjectedGPA: false,
        projectedGPA: 0,
        displayClear: false,
        periodNumber: 1,
      







        





        

        




				
				
				validateGPA() {
					if(this.currentGPA > 4 || this.currentGPA < 0) {
						this.hasGPAError = true;
						this.disableCourseInput = true;
						this.disableCourseFields = true;
						this.disableEditFields = true;
						this.displayProjectedGPA = false;
						
					}
					else {
						this.hasGPAError = false;
						this.checkForCurrentGPAandGrade();
					}
				},
				checkForCurrentGPAandGrade() {
					if(!this.hasGPAError && this.currentGradeLevel > 9 && this.addCourseButtonText != "NULL") {
						this.disableCourseInput = false;
						this.disableCourseFields = false;
						this.disableEditFields = false;
						this.displayAdd = true;
						this.displayProjectedGPA = true;
						this.displayClear = true;
					}
				},
				toggleInputs() {
					this.disableCourseInput = !this.disableCourseInput;
				},
				
				_updateCourseList(oldCourseName, newCourseInfo) {
					let courseListCopy = {};
					for (const[course, grade] of Object.entries(this.courseList)) {
						if(course == oldCourseName) {
							courseListCopy[newCourseInfo[0]] = newCourseInfo[1];
						}
						else {
							courseListCopy[course] = grade;
						}
					}
					this.courseList = courseListCopy;
				},
				_resolveDuplicateCourse(inputTitle, inputGrade, oldCourseName = "") {
					let newCourseTitle = inputTitle;
					let courseTitleWithSection = newCourseTitle + " Section 1";
					let tempGradeHolder = 0;
					let isDuplicate = false;

					if (inputTitle !== oldCourseName) {
						if(newCourseTitle in this.courseList || courseTitleWithSection in this.courseList) {
							isDuplicate = true;
							for(const[course, grade] of Object.entries(this.courseList)) {
								if(course.includes(newCourseTitle)) {
									courseTitleWithSection = course;
									tempGradeHolder = grade;
								}
							}
						}

						if(isDuplicate){
							if(courseTitleWithSection.includes(" Section ")) {
								let titlePieces = courseTitleWithSection.split(" ");
								let lastIndex = titlePieces.length - 1;
								let currentNumber = titlePieces[lastIndex];
								let nextNumber = Number(currentNumber) + 1;
								titlePieces[lastIndex] = nextNumber;
								newCourseTitle = titlePieces.join(" ");
							}
							else {
								newCourseTitle = newCourseTitle + " Section 2";
								let oldCourseInfo = inputTitle;
								let newCourseInfo = [(inputTitle + " Section 1"), tempGradeHolder];
								this._updateCourseList(oldCourseInfo, newCourseInfo);
							}
						}
						
						if (oldCourseName === "") {
              this.courseList[newCourseTitle] = inputGrade;
            } else {
              this._updateCourseList(oldCourseName, [newCourseTitle, inputGrade]);
            }
					} else {
						this.courseList[oldCourseName] = inputGrade;
					}

					this.calculate();
				},
				addCourse() {
					/*
						blockSchedule 
						A: [1, 2, 3, 4]
						B: [1, 2, 3, 4]
					*/
					let courseTitleAdded = this.courseTitle.trim() != "";

					if (this.disableCourseInput){
						this.courseList[this.blockDay + this.periodNumber] = "No scheduled course this period.";
					}
					else if (courseTitleAdded) {
						this._resolveDuplicateCourse(this.courseTitle, this.courseGrade);
					}

					if(this.disableCourseInput || courseTitleAdded) {
						let nextPeriod = this.periodNumber;
						nextPeriod += 1;
						this.displayEdit = true;
						if(nextPeriod > 4 && this.blockDay == 'A') {
							this.periodNumber = 1;
							this.blockDay = 'B';
						}
						else if(nextPeriod == 4 && this.blockDay == 'B') {
							this.addCourseButtonText = "FINISH";
							this.periodNumber = nextPeriod;
						}
						else if(nextPeriod > 4) {
							this.addCourseButtonText = "NULL";
							this.disableCourseInput = true;
							this.displayAdd = false;
						}
						else {
							this.periodNumber = nextPeriod;
						}
						
					}
					if(this.addCourseButtonText !== "NULL") {
						if(this.noCourse){this.noCourse = false; this.toggleInputs();}
					} else {
						this.noCourse = false;
					}
					this.courseTitle = "";
					this.updateCourseListDisplay();

				},
				_gradeToGPA(grade) {
					if(grade >= 93) { return 4.0; }
					else if(grade >= 90) {return 3.7;}
					else if(grade >= 87) {return 3.3;}
					else if(grade >= 83) {return 3.0;}
					else if(grade >= 80) {return 2.7;}
					else if(grade >= 77) {return 2.3;}
					else if(grade >= 73) {return 2.0;}
					else if(grade >= 70) {return 1.7;}
					else if(grade >= 67) {return 1.3;}
					else if(grade >= 63) {return 1.0;}
					else if(grade >= 60) {return 0.7;}
					else {return 0.0;}
				},
				updateCourseListDisplay() {
					this.courseListDisplay = "";
					if(Object.keys(this.courseList).length > 0){
						const blockKey = ["A1", "A2", "A3", "A4", "B1", "B2", "B3", "B4"];
						let counter = 0;
						for (const [course, grade] of Object.entries(this.courseList)) {
							if(grade == "No scheduled course this period."){
								this.courseListDisplay += blockKey[counter]+ ": " + grade + "\n";
							}
							else {
								this.courseListDisplay += blockKey[counter] + ": " + course + " --- " + grade + "%\n";
							}
							counter++;
						}
					}
					else {this.courseListDisplay = "No courses added.";}
				},
				calculate() {
					const creditsPerGrade = {
						10: 8,
						11: 16,
						12: 24
					};
					let currentCredits = 0;
					let numCredits = 0;
					let newGPAs = 0;
					//calculate number of credits
					if(this.currentGradeLevel > 9) {
						currentCredits = creditsPerGrade[this.currentGradeLevel];
					}
					if(Object.keys(this.courseList).length > 0) {
						numCredits = currentCredits;
						for (const [course, grade] of Object.entries(this.courseList)) {
							if(grade != "No scheduled course this period.") {
								newGPAs += this._gradeToGPA(grade);
								numCredits++;
							}			
						}
					}
					if(numCredits > 0) {
						this.projectedGPA = (this.currentGPA * currentCredits + newGPAs) / numCredits;
					}
					else {
						this.projectedGPA = this.currentGPA;
					}
				},
				updateEditFields() {
					const blockKey = ["A1", "A2", "A3", "A4", "B1", "B2", "B3", "B4"];
					let position = 0;
					let counter = 0;
					for (const[course, grade] of Object.entries(this.courseList)) {
						if(this.courseToEdit == course) {position = counter;}
						counter++;
					}
					this.blockEdit = blockKey[position];
					

					this.courseTitleEdit = this.courseToEdit;
					this.courseGradeEdit = this.courseList[this.courseToEdit];

				},
				editCourse() {
					if(this.courseToEdit != "") {
						this._resolveDuplicateCourse(this.courseTitleEdit, this.courseGradeEdit, this.courseToEdit);
						this.courseToEdit = "";
						this.courseTitleEdit = "";
						this.courseGradeEdit = 100;
						this.calculate();
						this.updateCourseListDisplay();
					}
				},
				resetCourses() {
					this.courseList = {};
					this.projectedGPA = this.currentGPA;
					this.addCourseButtonText = "NEXT";
					this.disableCourseInput = false;
					this.displayAdd = true;
					this.displayEdit = false;
					this.blockDay = 'A';
					this.periodNumber = 1;
					this.blockEdit = "";
					this.courseToEdit = "";
					this.courseTitleEdit = "";
					this.courseGradeEdit = 100;
					this.updateCourseListDisplay();
				},
				reset() {
          this.currentGPA = 0.00;
          this.hasGPAError = false;
          this.currentGradeLevel = 9;
          this.displayAdd = false;
          this.displayEdit = false;
          this.displayProjectedGPA = false;
          this.displayClear = false;
          this.noCourse = false;
          this.disableCourseFields = false;
          this.disableEditFields = false;
          this.courseTitle = "";
          this.courseGrade = 100;

          this.resetCourses();
        }
			}))
		})
	</script>
</body>
</html>
